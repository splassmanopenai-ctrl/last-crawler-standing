<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2b2533">
<title>Last Crawler Standing</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Crawler">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
  /* Look: printed pulp card, taken from the card art. Flat colour, black ink outlines, hard offset shadows.
     No gradients, glows or ambient animation: motion only answers something that just happened. */
  :root { --stone:#2b2533; --ink:#000; --paper:#ecdcb4; --chalk:#f1e9d6; --dim:#b9aec4; --muted:#5a4a2c; --gold:#f5b921; --blood:#d8262c;
    --display:Impact,"HelveticaNeue-CondensedBlack","Avenir Next Condensed","Roboto Condensed","Arial Narrow",sans-serif-condensed,sans-serif;
    --body:"Trebuchet MS","Gill Sans","Segoe UI",system-ui,sans-serif; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; background:var(--stone); color:var(--chalk); font:16px/1.45 var(--body);
         padding:12px 16px calc(20px + env(safe-area-inset-bottom)); touch-action:manipulation; -webkit-text-size-adjust:100%; }
  #app { max-width:480px; margin:0 auto; display:flex; flex-direction:column; gap:14px; }
  p { margin:0; }

  /* Type: the slanted condensed capitals of the card banners, used for the title and room code only. */
  h1, .code { font-family:var(--display); font-style:italic; font-weight:800; text-transform:uppercase; margin:0; color:var(--gold); text-shadow:3px 3px 0 var(--ink); }
  h1 { font-size:40px; line-height:.95; margin:14px 0 0; transform:rotate(-2deg); transform-origin:left; }
  .code { font-size:60px; line-height:1; letter-spacing:.08em; }
  h2 { font:700 16px/1.3 var(--body); margin:0; }
  .tag, .note { color:var(--dim); font-size:14px; }
  .panel .tag { color:var(--muted); }

  .group { display:flex; flex-direction:column; gap:8px; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .grid.three { grid-template-columns:repeat(3,1fr); }
  .bar { display:flex; justify-content:space-between; align-items:center; gap:10px; }

  /* Parchment panel = the game needs something from you. Waiting states are plain text on the stone. */
  .panel { background:var(--paper); color:var(--ink); border:3px solid var(--ink); border-radius:4px; box-shadow:5px 5px 0 var(--ink); padding:12px; display:flex; flex-direction:column; gap:10px; }
  .status { display:flex; flex-direction:column; gap:6px; }

  input { width:100%; min-height:48px; padding:0 12px; font:18px var(--body); color:var(--ink); background:var(--paper); border:2px solid var(--ink); border-radius:4px; }
  button { min-height:48px; padding:6px 12px; font:700 16px/1.2 var(--body); color:var(--ink); background:var(--gold); border:2px solid var(--ink); border-radius:4px; box-shadow:3px 3px 0 var(--ink); cursor:pointer; }
  button:active:not(:disabled) { transform:translate(2px,2px); box-shadow:1px 1px 0 var(--ink); }
  button.hot { background:var(--ink); color:var(--paper); }
  button.ghost { background:transparent; color:inherit; border-color:currentColor; box-shadow:none; }
  button:disabled { opacity:.4; box-shadow:none; }
  button small { display:block; font-weight:400; font-size:12px; margin-top:2px; }
  button.mini { min-height:44px; min-width:44px; padding:0 12px; flex:none; font-size:14px; }
  :focus-visible { outline:3px solid #4aa3e8; outline-offset:2px; }

  /* The System speaks in a comic caption box. */
  #announcer { background:#ffe98a; color:var(--ink); border:3px solid var(--ink); padding:8px 12px; min-height:60px; font-weight:700; }

  .rival { display:flex; align-items:center; gap:8px; min-height:52px; padding:6px 0 6px 10px; border-bottom:2px solid var(--ink); border-left:6px solid transparent; }
  .rival.turn { border-left-color:var(--gold); }
  .rival .name { flex:1; font-weight:700; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .rival.dead .name { text-decoration:line-through; color:var(--dim); }
  .pip { font-size:12px; font-weight:700; color:var(--ink); padding:2px 6px; border:2px solid var(--ink); border-radius:3px; white-space:nowrap; }
  .back { flex:none; width:19px; height:26px; background:var(--card-back) center/contain no-repeat; }
  .pip.peek { border-style:dashed; opacity:.8; } /* a card only a spectator can see */
  .rival { position:relative; }
  .cancelled { position:absolute; left:46%; top:50%; translate:-50% -50%; rotate:-8deg; pointer-events:none; padding:0 10px;
    font:italic 800 22px/1.2 var(--display); text-transform:uppercase; color:var(--blood); border:3px solid var(--blood); background:rgba(43,37,51,.85); }
  .gold { display:inline-flex; align-items:center; gap:5px; font-weight:700; white-space:nowrap; font-variant-numeric:tabular-nums; }
  .coin { width:14px; height:14px; border-radius:50%; background:var(--gold); border:2px solid var(--ink); }

  /* Cards: the art is the loud thing; the frame copies the printed cards. */
  .card { position:relative; display:flex; flex-direction:column; overflow:hidden; min-height:0; padding:0; text-align:left; font-weight:400;
          background:var(--paper); color:var(--ink); border:3px solid var(--ink); border-radius:10px; box-shadow:4px 4px 0 var(--ink); }
  .card:disabled { opacity:1; box-shadow:4px 4px 0 var(--ink); }
  .art { position:relative; container-type:inline-size; }
  .slot { position:absolute; display:flex; align-items:center; justify-content:center; text-align:center; overflow:hidden;
          font:700 6.4cqw/1.15 var(--body); color:var(--ink); text-wrap:balance; }
  .card.gone .slot { opacity:.55; }
  .card img { display:block; width:100%; height:auto; border-bottom:3px solid var(--ink); }
  .card small { display:block; margin:0; padding:6px 8px; font-size:12.5px; line-height:1.35; }
  .card q { display:block; margin-top:3px; font-style:italic; quotes:'“' '”'; }
  .foot { margin-top:auto; padding:7px 8px; font-size:13px; border-top:2px dashed var(--ink); font-weight:400; color:var(--muted); }
  .card.play .foot { background:var(--gold); color:var(--ink); font-weight:700; text-align:center; border-top-style:solid; }
  .card.on { outline:4px solid var(--gold); outline-offset:1px; }
  .card.gone small { opacity:.55; }
  .card.gone small b { text-decoration:line-through; }

  .clock { align-self:flex-end; font-weight:700; font-variant-numeric:tabular-nums; }
  .clock:empty { display:none; }
  .clock.late { color:var(--blood); }
  details { color:var(--dim); font-size:14px; }
  summary { min-height:44px; display:flex; align-items:center; cursor:pointer; }
  details p { margin:6px 0; }
  details input { margin:6px 0; font-size:14px; }
  #toast { position:fixed; left:16px; right:16px; bottom:calc(16px + env(safe-area-inset-bottom)); z-index:7; background:var(--blood); color:#fff; border:2px solid var(--ink); padding:12px; border-radius:4px; text-align:center; font-weight:700; }
  #toast:empty { display:none; }

  /* Join screen: the cast fanned like a hand. */
  .fan { position:relative; height:190px; margin-top:8px; overflow-x:clip; }
  .fan img { position:absolute; left:50%; bottom:0; width:92px; height:auto; border:2px solid var(--ink); border-radius:7px; box-shadow:3px 3px 0 var(--ink); transform-origin:50% 140%; }

  .qr { align-self:center; width:180px; height:180px; image-rendering:pixelated; border:3px solid var(--ink); border-radius:6px; background:#fff; }
  .awards { display:flex; flex-direction:column; gap:6px; }
  .awards b { font:italic 800 17px var(--display); text-transform:uppercase; }

  /* Event overlays: bluff showdown, comic sound effects, flying coins. Only created when anime.js is running. */
  .showdown { position:fixed; inset:0; z-index:8; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px;
    padding:16px; text-align:center; background:rgba(20,16,28,.85); pointer-events:none; perspective:900px; }
  .burst { font:italic 800 48px/1 var(--display); text-transform:uppercase; color:var(--gold); text-shadow:4px 4px 0 var(--ink); }
  .who { font-weight:700; font-size:18px; }
  .flip { position:relative; width:160px; aspect-ratio:3/4; transform-style:preserve-3d; }
  .face { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; border:3px solid var(--ink); border-radius:10px; backface-visibility:hidden; }
  .face.back { transform:rotateY(180deg); background:#7d1418; }
  .solo { width:130px; aspect-ratio:3/4; object-fit:cover; }
  .showdown.win { background:rgba(20,16,28,.6); }
  .showdown.win .burst { font-size:56px; }
  .flip.liar .front { filter:grayscale(1) brightness(.7); }
  .flip.liar::after { content:"Liar"; position:absolute; left:50%; top:45%; translate:-50% -50%; rotate:-14deg; padding:0 12px;
    font:italic 800 40px var(--display); text-transform:uppercase; color:var(--blood); border:4px solid var(--blood); background:var(--paper); }
  .verdict { font:italic 800 28px/1.1 var(--display); text-transform:uppercase; text-shadow:3px 3px 0 var(--ink); }
  .verdict.lie { color:var(--blood); }
  .sfx { position:fixed; left:50%; top:40%; translate:-50% -50%; z-index:9; pointer-events:none; white-space:nowrap;
    font:italic 800 64px/1 var(--display); text-transform:uppercase; color:var(--gold); -webkit-text-stroke:2px var(--ink); text-shadow:5px 5px 0 var(--ink); }
  .heckle { position:fixed; bottom:90px; z-index:9; pointer-events:none; padding:6px 10px; border:2px solid var(--ink); border-radius:16px;
    background:var(--paper); color:var(--ink); font-size:14px; box-shadow:3px 3px 0 var(--ink); }
  .heckle b { font:italic 800 18px var(--display); text-transform:uppercase; color:var(--blood); }
  .flycoin { position:fixed; z-index:9; width:16px; height:16px; margin:-8px 0 0 -8px; border-radius:50%; background:var(--gold); border:2px solid var(--ink); pointer-events:none; }
  #app > .grid { perspective:900px; }
  /* Signature moves. Each is centred on the point it is placed at. */
  .flash { position:fixed; inset:0; z-index:9; pointer-events:none; }
  .grenade, .jaws, .crown, .bubble, .shield { position:fixed; z-index:9; pointer-events:none; translate:-50% -50%; }
  .grenade { width:22px; height:28px; border-radius:45%; background:#3f8f3a; border:2px solid var(--ink);
    box-shadow:inset 0 -6px 0 rgba(0,0,0,.25), inset 0 6px 0 rgba(255,255,255,.2); }
  .jaws { width:84px; height:64px; }
  .jaws i { position:absolute; left:0; right:0; height:30px; background:var(--chalk); border:2px solid var(--ink); }
  .jaws .top { top:0; border-radius:40px 40px 0 0; clip-path:polygon(0 0,100% 0,100% 70%,92% 100%,83% 70%,75% 100%,67% 70%,58% 100%,50% 70%,42% 100%,33% 70%,25% 100%,17% 70%,8% 100%,0 70%); }
  .jaws .bottom { bottom:0; border-radius:0 0 40px 40px; clip-path:polygon(0 30%,8% 0,17% 30%,25% 0,33% 30%,42% 0,50% 30%,58% 0,67% 30%,75% 0,83% 30%,92% 0,100% 30%,100% 100%,0 100%); }
  .crown { width:56px; height:40px; margin-top:-26px; background:var(--gold);
    clip-path:polygon(0 100%,0 25%,22% 55%,35% 5%,50% 45%,65% 5%,78% 55%,100% 25%,100% 100%); filter:drop-shadow(0 3px 0 var(--ink)); }
  .bubble { width:96px; height:96px; border-radius:50%; border:3px solid #9fd8ff; background:radial-gradient(circle at 35% 30%, rgba(255,255,255,.6), rgba(159,216,255,.25) 60%); }
  .bubble img { position:absolute; left:50%; top:50%; width:26px; margin:-18px 0 0 -13px; }
  .bubble img + img { margin-left:-3px; }
  .shield { width:120px; height:120px; border-radius:50%; border:3px solid #6be38a; background:radial-gradient(circle, rgba(107,227,138,.05) 40%, rgba(107,227,138,.45)); }

  /* Motion: only in answer to an event. */
  #announcer { display:flex; flex-direction:column; gap:4px; }
  #announcer p:not(:last-child) { font-weight:400; }
  .confetti { position:fixed; inset:0; pointer-events:none; z-index:6; overflow:hidden; }
  .confetti span { position:absolute; top:-30px; width:10px; height:16px; border:2px solid var(--ink); }
  .confetti { display:none; }
  .anime .confetti { display:block; } /* pieces only show when anime.js is there to throw them */
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation:none !important; transition:none !important; } }
</style>
</head>
<body>
<main id="app"></main>
<div id="toast" role="alert"></div>
<script src="vendor/anime.umd.min.js"></script>
<script src="vendor/qrcode.js"></script>
<script src="game.js"></script>
<script src="js/ui.js"></script>
<script src="js/net.js"></script>
<script src="js/fx.js"></script>
<script src="js/screens.js"></script>
<script src="js/app.js"></script>
</body>
</html>
