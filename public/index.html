<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#120b1f">
<title>Last Crawler Standing</title>
<style>
  :root { --bg:#120b1f; --panel:#1e1433; --line:#3a2a5c; --ink:#f3ecff; --dim:#a394c4; --hot:#ff2e88; --gold:#ffd23f; --ok:#35e0a1; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.4 system-ui,sans-serif;
         padding:12px 16px calc(16px + env(safe-area-inset-bottom)); touch-action:manipulation; -webkit-text-size-adjust:100%; }
  #app { max-width:480px; margin:0 auto; display:flex; flex-direction:column; gap:12px; }
  h1,h2,.big { font-family:Impact,Haettenschweiler,"Arial Narrow Bold",sans-serif; letter-spacing:.04em; text-transform:uppercase; margin:0; font-weight:400; }
  h1 { font-size:34px; line-height:1; color:var(--gold); text-shadow:3px 3px 0 var(--hot); transform:rotate(-2deg); margin:12px 0 4px; }
  h2 { font-size:15px; color:var(--dim); }
  .tag { color:var(--dim); font-size:14px; }
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:12px; display:flex; flex-direction:column; gap:10px; }
  input { width:100%; min-height:48px; padding:0 12px; font-size:18px; color:var(--ink); background:var(--bg); border:1px solid var(--line); border-radius:8px; }
  button { min-height:48px; padding:6px 12px; font:inherit; font-weight:700; color:var(--bg); background:var(--gold); border:0; border-radius:8px; cursor:pointer; }
  button.hot { background:var(--hot); color:#fff; }
  button.ghost { background:transparent; color:var(--ink); border:1px solid var(--line); }
  button:disabled { opacity:.35; }
  button small { display:block; font-weight:400; font-size:12px; }
  :focus-visible { outline:3px solid var(--ok); outline-offset:2px; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .bar { display:flex; justify-content:space-between; align-items:baseline; gap:8px; }
  .code { font-size:56px; color:var(--gold); letter-spacing:.15em; text-align:center; }
  #announcer { border-left:4px solid var(--hot); padding:8px 12px; background:var(--panel); border-radius:0 8px 8px 0; min-height:60px; }
  #announcer b { display:block; font-size:11px; color:var(--hot); letter-spacing:.1em; }
  .rival { display:flex; align-items:center; gap:8px; padding:8px 10px; background:var(--panel); border:1px solid var(--line); border-radius:8px; }
  .rival.turn { border-color:var(--gold); }
  .rival.dead { opacity:.45; }
  .rival .name { flex:1; font-weight:700; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .gold { color:var(--gold); font-weight:700; white-space:nowrap; }
  .pip { font-size:12px; padding:3px 6px; border-radius:5px; background:var(--line); white-space:nowrap; }
  .pip.gone { background:transparent; border:1px dashed var(--line); color:var(--dim); text-decoration:line-through; }
  .card { text-align:left; background:linear-gradient(160deg,#2c1d4d,#1e1433); color:var(--ink); border:2px solid var(--line); border-radius:12px; padding:10px; min-height:112px; font-weight:400; }
  .card .big { font-size:20px; color:var(--gold); }
  .card small { color:var(--dim); font-size:12px; }
  .card:disabled { opacity:1; }
  .card.gone { opacity:.4; text-decoration:line-through; }
  .card.on { border-color:var(--ok); box-shadow:0 0 0 2px var(--ok); }
  details { color:var(--dim); font-size:13px; }
  summary { min-height:44px; display:flex; align-items:center; cursor:pointer; }
  details p { margin:4px 0; }
  #toast { position:fixed; left:16px; right:16px; bottom:calc(16px + env(safe-area-inset-bottom)); background:var(--hot); color:#fff; padding:12px; border-radius:8px; text-align:center; font-weight:700; }
  #toast:empty { display:none; }
  .grid.three { grid-template-columns:repeat(3,1fr); }
  button.mini { min-height:44px; min-width:44px; padding:0; flex:none; }
  .clock { align-self:flex-end; font-weight:700; color:var(--dim); font-variant-numeric:tabular-nums; }
  .clock:empty { display:none; }
  .clock.late { color:var(--hot); }

  /* Show dressing: stage spotlights, broadcast scanlines, LIVE badge */
  body { background:
    radial-gradient(60% 40% at 0% 0%, rgba(255,46,136,.22), transparent 70%),
    radial-gradient(60% 40% at 100% 0%, rgba(255,210,63,.16), transparent 70%),
    var(--bg) fixed; min-height:100vh; }
  body::before { content:""; position:fixed; inset:0; pointer-events:none; z-index:5; opacity:.25;
    background:repeating-linear-gradient(0deg, transparent 0 2px, rgba(0,0,0,.45) 2px 3px); }
  .live { color:#fff; background:#e01e37; font:700 11px system-ui,sans-serif; letter-spacing:.08em; padding:2px 6px; border-radius:4px; vertical-align:middle; animation:blink 1.6s steps(2) infinite; }
  .card { position:relative; overflow:hidden; }
  .card:not(.gone)::after { content:""; position:absolute; inset:0; pointer-events:none;
    background:linear-gradient(115deg, transparent 40%, rgba(255,255,255,.14) 50%, transparent 60%); background-size:300% 100%; animation:sheen 5s linear infinite; }
  .card.gone::before { content:"💀"; position:absolute; right:8px; bottom:4px; font-size:28px; text-decoration:none; }
  button { transition:transform .08s; }
  button:active:not(:disabled) { transform:scale(.96); }
  h1 { animation:flicker 4s infinite; }
  .rival.turn { animation:glow 1.4s ease-in-out infinite; }
  .panel.myturn { border-color:var(--gold); animation:glow 1.4s ease-in-out infinite; }
  #announcer.in { animation:slidein .35s ease-out; }
  .pop { display:inline-block; animation:pop .5s ease-out; }
  .slam { animation:slam .6s ease-out; }
  .confetti { position:fixed; inset:0; pointer-events:none; z-index:6; overflow:hidden; }
  .confetti span { position:absolute; top:-40px; font-size:28px; animation:fall 2.4s ease-in forwards; }
  @keyframes blink { 50% { opacity:.45; } }
  @keyframes sheen { from { background-position:150% 0; } to { background-position:-150% 0; } }
  @keyframes flicker { 0%,92%,96%,100% { opacity:1; } 94% { opacity:.55; } }
  @keyframes glow { 0%,100% { box-shadow:0 0 0 0 rgba(255,210,63,0); } 50% { box-shadow:0 0 14px 1px rgba(255,210,63,.55); } }
  @keyframes slidein { from { transform:translateX(-16px); opacity:0; } }
  @keyframes pop { 40% { transform:scale(1.7); color:#fff; } }
  @keyframes slam { 0% { transform:scale(1.25) rotate(-4deg); filter:brightness(2.5); } 30% { transform:translateX(-5px); } 50% { transform:translateX(5px); } 70% { transform:translateX(-3px); } }
  @keyframes fall { to { transform:translateY(110vh) rotate(540deg); } }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation:none !important; transition:none !important; } }
</style>
</head>
<body>
<main id="app"></main>
<div id="toast" role="alert"></div>
<script src="game.js"></script>
<script src="app.js"></script>
</body>
</html>
